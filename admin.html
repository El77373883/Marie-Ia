<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eva Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e; color: #eee;
            padding: 20px; min-height: 100dvh; padding-bottom: 40px;
        }
        h1 { color: #D48A72; margin-bottom: 4px; font-size: 22px; }
        .subtitle { color: #777; font-size: 12px; margin-bottom: 24px; }
        .section {
            background: #16213e; border-radius: 14px; padding: 18px;
            margin-bottom: 18px; border: 1px solid #2a2a4a;
        }
        .section h2 { font-size: 15px; margin-bottom: 14px; color: #D48A72; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
        input, textarea, select {
            width: 100%; padding: 10px 12px; background: #0f0f23;
            border: 1px solid #2a2a4a; border-radius: 8px;
            color: #fff; font-size: 14px; font-family: inherit; margin-bottom: 10px;
            -webkit-appearance: none;
        }
        textarea { min-height: 80px; resize: vertical; }
        button {
            background: #D48A72; color: #1a1a2e; border: none;
            padding: 10px 20px; border-radius: 8px; font-weight: 600;
            font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        button:active { transform: scale(0.95); }
        button.red { background: #e74c3c; color: #fff; }
        button.small { padding: 6px 12px; font-size: 11px; }
        .item-list { display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto; }
        .item-card {
            background: #0f0f23; border-radius: 10px; padding: 12px;
            border: 1px solid #2a2a4a; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
        }
        .item-info { flex: 1; min-width: 150px; }
        .item-info .item-title { font-weight: 600; font-size: 14px; }
        .item-info .item-meta { font-size: 11px; color: #777; margin-top: 2px; }
        .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #16213e; border-radius: 10px; padding: 4px; }
        .tab {
            flex: 1; text-align: center; padding: 10px; border-radius: 8px;
            cursor: pointer; font-size: 13px; color: #aaa; transition: all 0.2s;
        }
        .tab.active { background: #D48A72; color: #1a1a2e; font-weight: 600; }
        .password-screen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100dvh; gap: 16px;
        }
        .password-screen input { width: 240px; text-align: center; font-size: 18px; }
        .status-bar { font-size: 11px; color: #D48A72; margin-bottom: 12px; min-height: 16px; }
    </style>
</head>
<body>

<div id="loginScreen" class="password-screen">
    <h1>Eva Admin</h1>
    <input type="password" id="passInput" placeholder="Contraseña" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Entrar</button>
</div>

<div id="adminPanel" style="display:none;">
    <h1>Eva Admin</h1>
    <p class="subtitle">Gestiona el contenido de tu IA</p>
    <div class="status-bar" id="statusBar"></div>

```
<div class="tabs">
    <div class="tab active" onclick="switchTab('responses')">Respuestas</div>
    <div class="tab"        onclick="switchTab('knowledge')">Conocimiento</div>
</div>

<div class="section">
    <h2>Agregar nuevo</h2>
    <div id="formFields"></div>
    <button onclick="addItem()">Guardar</button>
</div>

<div class="section">
    <h2>Contenido guardado</h2>
    <div class="item-list" id="itemsList"></div>
</div>

<button class="red" onclick="logout()" style="margin-top:12px;">Cerrar sesión</button>
```

</div>

<script>
    const PASS = 'eva2024';
    let currentTab = 'responses';

    // ============ AUTH ============
    function login() {
        if (document.getElementById('passInput').value === PASS) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display  = 'block';
            renderForm();
            renderList();
            setStatus('✅ Datos cargados correctamente');
        } else {
            alert('Contraseña incorrecta');
        }
    }

    function logout() {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminPanel').style.display  = 'none';
        document.getElementById('passInput').value = '';
    }

    // ============ STORAGE ============
    function getData(key) {
        try { return JSON.parse(localStorage.getItem('eva_' + key) || '[]'); } catch(e) { return []; }
    }
    function saveData(key, arr) {
        localStorage.setItem('eva_' + key, JSON.stringify(arr));
    }

    // ============ TABS ============
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(function(t) {
            t.classList.toggle('active', t.textContent.trim() === (tab === 'responses' ? 'Respuestas' : 'Conocimiento'));
        });
        renderForm();
        renderList();
    }

    // ============ FORMULARIOS ============
    function renderForm() {
        var f = document.getElementById('formFields');
        if (currentTab === 'responses') {
            f.innerHTML = `
                <label>Categoria (debe coincidir exacto con knowledge)</label>
                <input type="text" id="f_category" placeholder="ej: saludos">
                <label>Modelo</label>
                <select id="f_model">
                    <option value="eva">Eva</option>
                    <option value="selene">Selene</option>
                    <option value="nyx">Nyx</option>
                    <option value="aria">Aria</option>
                </select>
                <label>Respuesta</label>
                <textarea id="f_text" placeholder="Hola! Soy Eva..."></textarea>

```
        `;
    } else {
        f.innerHTML = `
            <label>Categoria</label>
            <input type="text" id="f_category" placeholder="ej: saludos">
            <label>Palabras clave (separadas por coma)</label>
            <input type="text" id="f_keywords" placeholder="hola, hey, buenas">
        `;
    }
}

// ============ GUARDAR ============
function addItem() {
    var category = (document.getElementById('f_category')?.value || '').trim().toLowerCase();
    if (!category) return alert('Llena la categoria');

    if (currentTab === 'responses') {
        var model = document.getElementById('f_model').value;
        var text  = (document.getElementById('f_text')?.value || '').trim();
        if (!text) return alert('Llena la respuesta');
        var arr = getData('responses');
        arr.push({ id: Date.now(), category: category, model: model, text: text });
        saveData('responses', arr);

    } else {
        var kw = (document.getElementById('f_keywords')?.value || '').trim();
        if (!kw) return alert('Llena las palabras clave');
        var arr2 = getData('knowledge');
        // Si ya existe esa categoria, fusionar keywords
        var idx = arr2.findIndex(function(k) { return k.category === category; });
        var incoming = kw.split(',').map(function(k) { return k.trim().toLowerCase(); }).filter(Boolean);
        if (idx >= 0) {
            arr2[idx].keywords = Array.from(new Set(arr2[idx].keywords.concat(incoming)));
        } else {
            arr2.push({ id: Date.now(), category: category, keywords: incoming });
        }
        saveData('knowledge', arr2);
    }

    setStatus('✅ Guardado');
    renderForm();
    renderList();
}

// ============ LISTA ============
function renderList() {
    var listDiv = document.getElementById('itemsList');
    var items   = getData(currentTab);

    if (items.length === 0) {
        listDiv.innerHTML = '<p style="color:#777;text-align:center;padding:20px;">No hay contenido aun</p>';
        return;
    }

    listDiv.innerHTML = items.map(function(item) {
        var title = currentTab === 'responses'
            ? (item.text || '').substring(0, 60)
            : (Array.isArray(item.keywords) ? item.keywords.join(', ') : '');
        var meta = currentTab === 'responses'
            ? item.category + ' — ' + item.model
            : 'Categoria: ' + item.category;
        return '<div class="item-card">'
            + '<div class="item-info">'
            + '<div class="item-title">' + esc(title) + '</div>'
            + '<div class="item-meta">' + esc(meta) + '</div>'
            + '</div>'
            + '<button class="small red" onclick="deleteItem(\'' + currentTab + '\',' + item.id + ')">Eliminar</button>'
            + '</div>';
    }).join('');
}

// ============ ELIMINAR ============
function deleteItem(key, id) {
    if (!confirm('Eliminar?')) return;
    var arr = getData(key).filter(function(i) { return i.id !== id; });
    saveData(key, arr);
    setStatus('🗑️ Eliminado');
    renderList();
}

// ============ UTILS ============
function setStatus(msg) { document.getElementById('statusBar').textContent = msg; }
function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
```

</script>
</body>
</html>
