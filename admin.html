<div id="loginScreen" class="password-screen">
    <h1 style="color:#D48A72;">Eva Admin</h1>
    <input type="password" id="passInput" placeholder="Contraseña" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Entrar</button>
</div>

<div id="adminPanel" style="display:none;">
    <h1>Eva Admin</h1>
    <p class="subtitle">Gestiona el contenido de tu IA</p>
    <div class="status-bar" id="statusBar">Cargando...</div>

    <div class="tabs">
        <div class="tab active"    onclick="switchTab('responses')">Respuestas</div>
        <div class="tab"           onclick="switchTab('knowledge')">Conocimiento</div>
        <div class="tab"           onclick="switchTab('models')">Modelos</div>
    </div>

    <!-- Agregar contenido -->
    <div class="section">
        <h2>Agregar nuevo</h2>
        <div id="formFields"></div>
        <button onclick="addItem()">Guardar</button>
    </div>

    <!-- Lista de items -->
    <div class="section">
        <h2>Contenido existente</h2>
        <div class="item-list" id="itemsList"></div>
    </div>

    <button class="red" onclick="logout()" style="margin-top:12px;">Cerrar sesión</button>
</div>

<!-- ✅ Firebase v10 modular (versión que SÍ existe) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBiUKBNFkMcW2-5AMPZPxrmtqXzu4rS9ZM",
        authDomain: "gen-lang-client-0059662230.firebaseapp.com",
        projectId: "gen-lang-client-0059662230",
        storageBucket: "gen-lang-client-0059662230.firebasestorage.app",
        messagingSenderId: "146794930401",
        appId: "1:146794930401:web:8eb012b2c3302b8381d7a0"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    let currentTab = 'responses';
    let allData    = { responses: [], knowledge: [], models: [] };

    const ADMIN_PASS = 'eva2024';

    // ============ AUTH ============
    window.login = function() {
        const pass = document.getElementById('passInput').value;
        if (pass === ADMIN_PASS) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display  = 'block';
            loadAll();
        } else {
            alert('Contraseña incorrecta');
        }
    };

    window.logout = function() {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminPanel').style.display  = 'none';
        document.getElementById('passInput').value           = '';
    };

    // ============ TABS ============
    window.switchTab = function(tab) {
        currentTab = tab;
        // Marcar tab activo
        document.querySelectorAll('.tab').forEach(t => {
            const labels = { responses: 'Respuestas', knowledge: 'Conocimiento', models: 'Modelos' };
            t.classList.toggle('active', t.textContent.trim() === labels[tab]);
        });
        renderForm();
        renderList();
    };

    // ============ FORMULARIOS ============
    function renderForm() {
        const formDiv = document.getElementById('formFields');
        if (currentTab === 'responses') {
            formDiv.innerHTML = `
                <label>Categoria (saludos, despedidas, etc)</label>
                <input type="text" id="f_category" placeholder="saludos">
                <label>Modelo</label>
                <select id="f_model">
                    <option value="eva">Eva</option>
                    <option value="selene">Selene</option>
                    <option value="nyx">Nyx</option>
                    <option value="aria">Aria</option>
                </select>
                <label>Respuesta</label>
                <textarea id="f_text" placeholder="Hola! Soy Eva..."></textarea>
            `;
        } else if (currentTab === 'knowledge') {
            formDiv.innerHTML = `
                <label>Categoria (saludos, despedidas, etc)</label>
                <input type="text" id="f_category" placeholder="saludos">
                <label>Palabras clave (separadas por coma)</label>
                <input type="text" id="f_keywords" placeholder="hola, hey, buenas">
            `;
        } else if (currentTab === 'models') {
            formDiv.innerHTML = `
                <label>ID del modelo (sin espacios, ej: eva)</label>
                <input type="text" id="f_modelId" placeholder="eva">
                <label>Nombre que ve el usuario</label>
                <input type="text" id="f_name" placeholder="Eva 1.0">
                <label>Estilo (directa / creativa / profunda / analitica)</label>
                <input type="text" id="f_style" placeholder="directa">
                <label>Saludo en pantalla principal</label>
                <textarea id="f_greeting" placeholder="Hola, soy Eva.&#10;En que puedo ayudarte?"></textarea>
            `;
        }
    }

    // ============ GUARDAR ============
    window.addItem = async function() {
        setStatus('Guardando...');
        try {
            if (currentTab === 'responses') {
                const category = val('f_category');
                const model    = val('f_model');
                const text     = val('f_text');
                if (!category || !text) return alert('Llena categoria y respuesta');
                await addDoc(collection(db, 'responses'), { category, model, text, createdAt: Date.now() });

            } else if (currentTab === 'knowledge') {
                const category = val('f_category');
                const keywords = val('f_keywords');
                if (!category || !keywords) return alert('Llena categoria y palabras clave');
                await addDoc(collection(db, 'knowledge'), {
                    category,
                    keywords: keywords.split(',').map(k => k.trim().toLowerCase()).filter(Boolean),
                    createdAt: Date.now()
                });

            } else if (currentTab === 'models') {
                const modelId  = val('f_modelId').toLowerCase().replace(/\s+/g,'');
                const name     = val('f_name');
                const style    = val('f_style');
                const greeting = val('f_greeting');
                if (!modelId || !name) return alert('Llena al menos ID y Nombre');
                await addDoc(collection(db, 'models'), { modelId, name, style, greeting, createdAt: Date.now() });
            }

            setStatus('✅ Guardado correctamente');
            await loadAll();
            renderForm(); // limpiar campos
        } catch (e) {
            setStatus('❌ Error: ' + e.message);
            console.error(e);
        }
    };

    // ============ CARGAR ============
    async function loadAll() {
        setStatus('Sincronizando con Firebase...');
        try {
            // ✅ Sin orderBy para no necesitar índices en Firestore
            const [respSnap, knowSnap, modelSnap] = await Promise.all([
                getDocs(collection(db, 'responses')),
                getDocs(collection(db, 'knowledge')),
                getDocs(collection(db, 'models'))
            ]);

            allData.responses = respSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            allData.knowledge = knowSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            allData.models    = modelSnap.docs.map(d => ({ id: d.id, ...d.data() }));

            // Ordenar por createdAt manualmente (no requiere índice)
            const byDate = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
            allData.responses.sort(byDate);
            allData.knowledge.sort(byDate);
            allData.models.sort(byDate);

            setStatus(`✅ ${allData.models.length} modelos · ${allData.knowledge.length} categorías · ${allData.responses.length} respuestas`);
            renderList();
        } catch (e) {
            setStatus('❌ Error al cargar: ' + e.message);
            console.error(e);
        }
    }

    // ============ RENDERIZAR LISTA ============
    function renderList() {
        const listDiv = document.getElementById('itemsList');
        const items   = allData[currentTab] || [];

        if (items.length === 0) {
            listDiv.innerHTML = '<p style="color:#777;text-align:center;padding:20px;">No hay contenido aun</p>';
            return;
        }

        listDiv.innerHTML = items.map(item => {
            let title = '';
            let meta  = '';
            if (currentTab === 'responses') {
                title = item.text?.substring(0, 60) || '(sin texto)';
                meta  = `${item.category || '?'} — ${item.model || '?'}`;
            } else if (currentTab === 'knowledge') {
                title = Array.isArray(item.keywords) ? item.keywords.join(', ') : '(sin keywords)';
                meta  = 'Categoria: ' + (item.category || '?');
            } else {
                title = item.name || item.modelId || '(sin nombre)';
                meta  = 'ID: ' + (item.modelId || item.id);
            }
            return `
                <div class="item-card">
                    <div class="item-info">
                        <div class="item-title">${escHtml(title)}</div>
                        <div class="item-meta">${escHtml(meta)}</div>
                    </div>
                    <div class="item-actions">
                        <button class="small red" onclick="deleteItem('${currentTab}','${item.id}')">Eliminar</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ============ ELIMINAR ============
    window.deleteItem = async function(collName, id) {
        if (!confirm('Eliminar este elemento?')) return;
        try {
            await deleteDoc(doc(db, collName, id));
            setStatus('🗑️ Eliminado');
            await loadAll();
        } catch (e) {
            setStatus('❌ Error al eliminar: ' + e.message);
        }
    };

    // ============ UTILS ============
    function val(id) {
        return (document.getElementById(id)?.value || '').trim();
    }
    function setStatus(msg) {
        document.getElementById('statusBar').textContent = msg;
    }
    function escHtml(str) {
        return String(str)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
    }

    // ============ INIT ============
    renderForm();
</script>
